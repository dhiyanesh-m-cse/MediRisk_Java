<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediRisk AI — Health Reports & Documents</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="brand-logo">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
      </div>
      <div>
        <div class="brand-title">MEDI<span>RISK</span></div>
        <div class="brand-subtitle">PATIENT INTELLIGENCE</div>
      </div>
    </div>
    <div class="user-badge">
      <span style="color: #10B981;">●</span> <span id="userName">User</span>
    </div>
  </header>

  <!-- Container -->
  <main class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <div>
        <h2 class="font-display" style="font-size: 1.5rem; font-weight: 700;">Health Reports & Records</h2>
        <p style="font-size: 0.8rem; color: var(--text-subtle); margin-top: 4px;">
          Document metadata managed by Core Java <code style="color: var(--cyan-accent);">health_records.txt</code>
        </p>
      </div>
      <button onclick="window.print()" class="btn-secondary" style="width: auto; padding: 8px 14px; font-size: 0.8rem;">🖨️ Print Summary</button>
    </div>

    <!-- Add New Record Form Card -->
    <div class="card">
      <div class="card-title">ADD HEALTH DOCUMENT METADATA</div>
      <form id="addRecordForm">
        <div class="form-group">
          <label class="form-label">Document Title</label>
          <input type="text" id="recTitle" class="form-input" placeholder="e.g. Annual Blood Work Oct 2026" required>
        </div>
        <div class="vitals-grid">
          <div class="form-group">
            <label class="form-label">Category</label>
            <select id="recCategory" class="form-input" style="background: #1F2937;">
              <option value="report">Lab / Clinical Report</option>
              <option value="medical_history">Medical History PDF</option>
              <option value="patient_image">Patient Imaging File</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Filename</label>
            <input type="text" id="recFilename" class="form-input" placeholder="e.g. blood_test_result.pdf" required>
          </div>
        </div>
        <button type="submit" id="saveRecordBtn" class="btn-primary" style="margin-top: 6px;">+ Add Document Metadata</button>
      </form>
    </div>

    <!-- Saved Health Records List Container -->
    <div class="card">
      <div class="card-title">SAVED HEALTH DOCUMENTS</div>
      <div id="recordsListContainer">
        <p style="color: var(--text-subtle); font-size: 0.85rem; padding: 10px 0;">Loading documents from Java file database...</p>
      </div>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="/dashboard.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      Dashboard
    </a>
    <a href="/assessment.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      Assess
    </a>
    <a href="/history.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
      History
    </a>
    <a href="/reports.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Reports
    </a>
  </nav>

  <script src="/js/api.js"></script>
  <script>
    const user = UserSession.requireAuth();
    document.getElementById('userName').innerText = user.name || user.username;

    async function loadRecords() {
      const container = document.getElementById('recordsListContainer');
      try {
        const res = await MediRiskAPI.getHealthRecords();
        const records = res.data || [];
        
        if (records.length === 0) {
          container.innerHTML = '<p style="color: var(--text-subtle); font-size: 0.85rem; padding: 10px 0;">No document metadata saved in health_records.txt.</p>';
          return;
        }

        let html = '<div style="display: flex; flex-direction: column; gap: 10px;">';
        records.forEach(item => {
          html += `
            <div style="background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.06); padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center;">
              <div>
                <div style="font-size: 0.9rem; font-weight: 600; color: var(--text-white);">${item.title}</div>
                <div style="font-size: 0.75rem; color: var(--text-subtle); margin-top: 2px;">
                  📁 ${item.category} • <span class="font-mono">${item.filename}</span> • ${item.dateAdded}
                </div>
              </div>
              <button onclick="deleteRecord('${item.recordId}')" class="btn-secondary" style="width: auto; padding: 6px 12px; font-size: 0.75rem; color: #EF4444; border-color: rgba(239,68,68,0.2);">Delete</button>
            </div>
          `;
        });
        html += '</div>';
        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = `<p style="color: #EF4444; font-size: 0.85rem;">✖ ${err.message}</p>`;
      }
    }

    document.getElementById('addRecordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('recTitle').value.trim();
      const category = document.getElementById('recCategory').value;
      const filename = document.getElementById('recFilename').value.trim();

      const btn = document.getElementById('saveRecordBtn');
      btn.disabled = true;
      btn.innerText = 'Saving to health_records.txt...';

      try {
        const res = await MediRiskAPI.createHealthRecord(title, category, filename, 250000);
        if (res.success) {
          showToast('Document metadata saved to Java backend!', 'success');
          document.getElementById('addRecordForm').reset();
          loadRecords();
        } else {
          showToast(res.error || 'Failed to save record', 'error');
        }
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerText = '+ Add Document Metadata';
      }
    });

    async function deleteRecord(id) {
      if (!confirm(`Delete record ${id} from Java file database?`)) return;
      try {
        const res = await MediRiskAPI.deleteHealthRecord(id);
        if (res.success) {
          showToast('Record deleted!', 'success');
          loadRecords();
        } else {
          showToast(res.error || 'Delete failed', 'error');
        }
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    loadRecords();
  </script>
</body>
</html>
