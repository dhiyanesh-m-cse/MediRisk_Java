<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediRisk AI &mdash; Patient Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .patients-container {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 1.5rem;
      margin-top: 2rem;
    }
    
    @media (max-width: 900px) {
      .patients-container {
        grid-template-columns: 1fr;
      }
    }
    
    .search-bar {
      margin-bottom: 1.5rem;
      position: relative;
    }
    
    .search-bar input {
      padding-left: 2.5rem;
    }
    
    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
    }

    .patient-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      margin-bottom: 0.5rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .patient-list-item:hover {
      background-color: rgba(255, 255, 255, 0.05);
      border-color: var(--primary-color);
    }
    
    .patient-info p {
      margin: 0;
      color: var(--text-secondary);
      font-size: 0.875rem;
    }
    
    .patient-info h4 {
      margin: 0 0 0.25rem 0;
      color: var(--text-primary);
    }

    .patient-actions {
      display: flex;
      gap: 0.5rem;
    }
  </style>
</head>
<body class="dark-theme">
  <!-- Top Navigation -->
  <header class="topbar">
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
      </svg>
      MediRisk <span style="color: var(--text-secondary)">| Core Java</span>
    </div>
    <nav class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="patients.html" class="active">Patients</a>
      <a href="patients.html">Patients</a>`n      <a href="assessment.html">New Assessment</a>
      <a href="history.html">History</a>
      <a href="reports.html">Reports</a>
    </nav>
    <div class="user-profile">
      <span id="userNameDisplay">Dr. Demo</span>
      <button onclick="UserSession.logout()" class="btn btn-outline" style="padding: 0.25rem 0.75rem; font-size: 0.875rem;">Logout</button>
    </div>
  </header>

  <main class="container">
    <header class="dashboard-header">
      <div>
        <h1>Patient Management</h1>
        <p class="subtitle">Add, edit, or remove patients</p>
      </div>
    </header>

    <div class="patients-container">
      
      <!-- Create / Edit Form -->
      <div class="card">
        <h3 class="card-title" id="formTitle">Add New Patient</h3>
        <form id="patientForm">
          <input type="hidden" id="patientId" />
          
          <div class="form-group">
            <label for="patientName">Full Name</label>
            <input type="text" id="patientName" required placeholder="e.g. John Doe">
          </div>
          
          <div class="form-group">
            <label for="patientAge">Age</label>
            <input type="number" id="patientAge" min="0" max="120" required>
          </div>
          
          <div class="form-group">
            <label for="patientGender">Gender</label>
            <select id="patientGender" required>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
          
          <div class="form-group">
            <label for="patientContact">Contact Number</label>
            <input type="text" id="patientContact" required placeholder="e.g. +1-555-0123">
          </div>
          
          <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary" id="saveBtn">Save Patient</button>
            <button type="button" class="btn btn-outline" id="cancelBtn" style="display: none;" onclick="resetForm()">Cancel</button>
          </div>
        </form>
      </div>

      <!-- Patient List -->
      <div class="card">
        <div class="search-bar">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="Search patients by name...">
        </div>
        
        <div id="loadingState" style="text-align: center; padding: 2rem; color: var(--text-secondary);">
          Loading patients...
        </div>
        
        <div id="emptyState" style="display: none; text-align: center; padding: 3rem; color: var(--text-secondary);">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="margin-bottom: 1rem; opacity: 0.5;">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <p>No patients found.</p>
        </div>
        
        <div id="patientListContainer">
          <!-- Patients will be rendered here -->
        </div>
      </div>
      
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    // Verify session
    const user = UserSession.requireAuth();
    document.getElementById('userNameDisplay').textContent = user.name || user.username;

    let allPatients = [];
    const patientListContainer = document.getElementById('patientListContainer');
    const loadingState = document.getElementById('loadingState');
    const emptyState = document.getElementById('emptyState');
    const searchInput = document.getElementById('searchInput');

    // DOM Elements for form
    const form = document.getElementById('patientForm');
    const formTitle = document.getElementById('formTitle');
    const idInput = document.getElementById('patientId');
    const nameInput = document.getElementById('patientName');
    const ageInput = document.getElementById('patientAge');
    const genderInput = document.getElementById('patientGender');
    const contactInput = document.getElementById('patientContact');
    const saveBtn = document.getElementById('saveBtn');
    const cancelBtn = document.getElementById('cancelBtn');

    async function loadPatients() {
      try {
        loadingState.style.display = 'block';
        patientListContainer.innerHTML = '';
        emptyState.style.display = 'none';

        const data = await MediRiskAPI.getPatients();
        // The API returns an array directly based on our server implementation
        allPatients = Array.isArray(data) ? data : (data.data || []);
        
        renderPatients(allPatients);
      } catch (error) {
        showToast(error.message, 'error');
        emptyState.style.display = 'block';
        emptyState.innerHTML = `<p style="color: #ef4444">${error.message}</p>`;
      } finally {
        loadingState.style.display = 'none';
      }
    }

    function renderPatients(patients) {
      patientListContainer.innerHTML = '';
      
      if (patients.length === 0) {
        emptyState.style.display = 'block';
        return;
      }
      
      emptyState.style.display = 'none';
      
      patients.forEach(p => {
        const el = document.createElement('div');
        el.className = 'patient-list-item';
        el.innerHTML = `
          <div class="patient-info">
            <h4>${p.name} <span style="font-size: 0.75rem; color: var(--primary-color); font-weight: normal; margin-left: 0.5rem">${p.id}</span></h4>
            <p>${p.age} years • ${p.gender} • ${p.contact}</p>
          </div>
          <div class="patient-actions">
            <button class="btn btn-outline" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="editPatient('${p.id}')">Edit</button>
            <button class="btn btn-outline" style="padding: 0.25rem 0.5rem; font-size: 0.75rem; color: #ef4444; border-color: rgba(239, 68, 68, 0.3);" onclick="deletePatient('${p.id}')">Delete</button>
          </div>
        `;
        patientListContainer.appendChild(el);
      });
    }

    function editPatient(id) {
      const p = allPatients.find(x => x.id === id);
      if (!p) return;
      
      idInput.value = p.id;
      nameInput.value = p.name;
      ageInput.value = p.age;
      genderInput.value = p.gender;
      contactInput.value = p.contact;
      
      formTitle.textContent = "Edit Patient";
      saveBtn.textContent = "Update Patient";
      cancelBtn.style.display = "block";
      
      window.scrollTo(0, 0);
    }

    function resetForm() {
      form.reset();
      idInput.value = "";
      formTitle.textContent = "Add New Patient";
      saveBtn.textContent = "Save Patient";
      cancelBtn.style.display = "none";
    }

    async function deletePatient(id) {
      if (!confirm("Are you sure you want to delete this patient?")) return;
      
      try {
        await MediRiskAPI.deletePatient(id);
        showToast("Patient deleted successfully", "success");
        if (idInput.value === id) resetForm();
        loadPatients();
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const payload = {
        name: nameInput.value,
        age: ageInput.value,
        gender: genderInput.value,
        contact: contactInput.value
      };
      
      const isEdit = idInput.value !== "";
      if (isEdit) {
        payload.id = idInput.value;
      }
      
      try {
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving...";
        
        if (isEdit) {
           await MediRiskAPI.request('/patients', {
             method: 'PUT',
             body: JSON.stringify(payload)
           });
           showToast("Patient updated successfully", "success");
        } else {
           await MediRiskAPI.createPatient(payload.name, payload.age, payload.gender, payload.contact);
           showToast("Patient added successfully", "success");
        }
        
        resetForm();
        loadPatients();
      } catch (error) {
        showToast(error.message, 'error');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = isEdit ? "Update Patient" : "Save Patient";
      }
    });

    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = allPatients.filter(p => 
        p.name.toLowerCase().includes(term) || 
        p.id.toLowerCase().includes(term)
      );
      renderPatients(filtered);
    });

    // Initial load
    document.addEventListener('DOMContentLoaded', loadPatients);
  </script>
</body>
</html>
